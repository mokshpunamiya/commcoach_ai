name: CI

on:
  push:
    branches: ["main", "dev", "feature/**"]
  pull_request:
    branches: ["main", "dev"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ──────────────────────────────────────────────────────────────
  # 1. FORMAT  (black + isort)
  # ──────────────────────────────────────────────────────────────
  format:
    name: "Format (black + isort)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install formatters
        run: pip install black==24.10.0 isort==5.13.2

      - name: black — check formatting
        run: black --check --diff .

      - name: isort — check import ordering
        run: isort --check-only --diff .

  # ──────────────────────────────────────────────────────────────
  # 2. LINT  (ruff)
  # ──────────────────────────────────────────────────────────────
  lint:
    name: "Lint (ruff)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install ruff
        run: pip install ruff==0.9.10

      - name: ruff — lint
        run: ruff check . --output-format=github --exclude ".venv,venv"

      - name: ruff — format check
        run: ruff format --check .

  # ──────────────────────────────────────────────────────────────
  # 3. TYPE CHECK  (mypy)
  # ──────────────────────────────────────────────────────────────
  typecheck:
    name: "Type Check (mypy)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install mypy + stubs
        run: |
          pip install mypy==1.13.0 types-requests==2.32.0.20241016 pydantic==2.10.6

      - name: mypy — type check
        run: |
          mypy schema.py config.py analysis/ database/ graph/state.py \
            --ignore-missing-imports \
            --no-error-summary

  # ──────────────────────────────────────────────────────────────
  # 4. SECURITY — Dependency vulnerabilities  (pip-audit / Safety)
  # ──────────────────────────────────────────────────────────────
  dependency-audit:
    name: "Security — Dependency Audit (pip-audit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install pip-audit
        run: pip install pip-audit==2.8.0

      - name: pip-audit — scan requirements.txt
        run: pip-audit -r requirements.txt --progress-spinner=off

  # ──────────────────────────────────────────────────────────────
  # 5. SECURITY — Static analysis  (bandit)
  # ──────────────────────────────────────────────────────────────
  sast:
    name: "Security — SAST (bandit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install bandit
        run: pip install bandit[toml]==1.8.3

      - name: bandit — scan source
        # -lll = high severity only so low-noise false-positives don't block CI;
        # -iii = high confidence only
        run: |
          bandit -r . \
            --exclude ./.venv,./tests,./frontend \
            -lll -iii \
            --format txt

  # ──────────────────────────────────────────────────────────────
  # 6. SECURITY — Secrets detection  (trufflehog / gitleaks)
  # ──────────────────────────────────────────────────────────────
  secrets-scan:
    name: "Security — Secrets Scan (gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for gitleaks

      - name: gitleaks — detect hardcoded secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────
  # 7. TESTS  (pytest + coverage)
  # ──────────────────────────────────────────────────────────────
  test:
    name: "Tests (pytest)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install test dependencies
        run: |
          pip install \
            pytest==8.3.5 \
            pytest-cov==6.0.0 \
            pytest-asyncio==0.25.3 \
            httpx==0.28.1 \
            pydantic==2.10.6 \
            fastapi==0.115.0 \
            numpy==1.26.4 \
            requests==2.32.3

      - name: pytest — run test suite
        env:
          # Provide dummy values so config.py loads without errors in CI
          SARVAM_API_KEY: "ci-dummy-key"
          OPENAI_API_KEY: "ci-dummy-key"
        run: |
          pytest tests/ \
            --tb=short \
            -q \
            --cov=analysis \
            --cov=database \
            --cov=schema \
            --cov=config \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=60

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # ──────────────────────────────────────────────────────────────
  # 8. DOCKER BUILD  (verify Dockerfile builds cleanly)
  # ──────────────────────────────────────────────────────────────
  docker-build:
    name: "Docker Build"
    runs-on: ubuntu-latest
    # Only run on the main / dev branches to save minutes on every feature PR
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t commcoach-ai:ci .

  # ──────────────────────────────────────────────────────────────
  # 9. FINAL GATE  (all jobs must pass)
  # ──────────────────────────────────────────────────────────────
  ci-gate:
    name: "CI Gate"
    runs-on: ubuntu-latest
    needs:
      - format
      - lint
      - typecheck
      - dependency-audit
      - sast
      - secrets-scan
      - test
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          results='${{ toJson(needs) }}'
          failed=$(echo "$results" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          failed = [k for k, v in data.items() if v['result'] not in ('success', 'skipped')]
          if failed:
              print('FAILED jobs: ' + ', '.join(failed))
              sys.exit(1)
          print('All jobs passed.')
          ")
