<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CommCoach AI</title>
  <!-- Vendor scripts served locally (no CDN required) -->
  <script src="/static/vendor/react.production.min.js"></script>
  <script src="/static/vendor/react-dom.production.min.js"></script>
  <script src="/static/vendor/prop-types.min.js"></script>
  <script src="/static/vendor/Recharts.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#14122B;color:#F7F4FF;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;}
    #root{min-height:100vh;}
    #splash{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:18px;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .spinner{width:40px;height:40px;border:3px solid #332F5C;border-top-color:#FF5533;border-radius:50%;animation:spin .8s linear infinite;}
    @keyframes wfPulse{0%,100%{transform:scaleY(0.35);}50%{transform:scaleY(1);}}
    @keyframes floatBlob{0%,100%{transform:translate(0,0);}50%{transform:translate(20px,-16px);}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
    .cc-fade{animation:fadeUp 0.4s ease both;}
    .cc-bar{animation:wfPulse 1.1s ease-in-out infinite;transform-origin:center;}
    .cc-scroll::-webkit-scrollbar{height:6px;width:6px;}
    .cc-scroll::-webkit-scrollbar-thumb{background:#332F5C;border-radius:3px;}
    .cc-input,.cc-select,.cc-textarea{width:100%;background:#1A1838;border:1px solid #332F5C;color:#F7F4FF;border-radius:10px;padding:10px 12px;font-size:13.5px;outline:none;}
    .cc-textarea{resize:vertical;min-height:90px;line-height:1.5;}
    .cc-input::placeholder,.cc-textarea::placeholder{color:#9C97C4;}
    #error-banner{display:none;position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#FF5533;color:#14122B;padding:10px 20px;border-radius:10px;font-size:13px;z-index:9999;max-width:90vw;text-align:center;}
    /* ── GNOME HIG: visible keyboard focus rings ── */
    :focus-visible{outline:2px solid #FF5533;outline-offset:3px;border-radius:6px;}
    button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid #FF5533;outline-offset:3px;}
    /* ── Responsive: stepper wraps on very small screens ── */
    @media(max-width:480px){
      .cc-input,.cc-textarea{font-size:16px;}/* prevent iOS zoom */
    }
    /* ── Skeleton loading animation ── */
    @keyframes ccSkeleton{0%,100%{opacity:.4;}50%{opacity:.8;}}
    .cc-skeleton{background:#1E1B42;border-radius:8px;animation:ccSkeleton 1.4s ease-in-out infinite;}
  </style>
  <!-- Fallback guard: hide splash if app.js never mounts React -->
  <script>
    window._ccSplashGuard = setTimeout(function() {
      var s = document.getElementById("splash");
      var b = document.getElementById("error-banner");
      if (s && s.style.display !== "none") {
        s.style.display = "none";
        if (b) { b.style.display = "block"; b.textContent = "App failed to start — open the browser console (F12) for details."; }
      }
    }, 10000);
  </script>
</head>
<body>
  <!-- Shown immediately while scripts load -->
  <div id="splash">
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="width:34px;height:34px;border-radius:10px;background:#FF5533;display:flex;align-items:center;justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14122B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
      </div>
      <span style="font-size:19px;font-weight:700;letter-spacing:-0.3px;">CommCoach AI</span>
    </div>
    <div class="spinner"></div>
    <span style="color:#9C97C4;font-size:13px;">Loading…</span>
  </div>
  <div id="error-banner"></div>
  <div id="root"></div>

  <script src="/static/vendor/app.js"></script>
</body>
</html>
