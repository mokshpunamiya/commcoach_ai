    "faster-whisper==1.0.3",
    "langchain==0.3.7",
    "langchain-core>=0.3.17,<0.4.0",
    "langchain-openai==0.2.8",
    "langgraph==0.2.53",
    "langgraph-checkpoint-sqlite==2.0.1",
    "language-tool-python==2.8.1",
    "librosa==0.10.2.post1",
    "numpy==1.26.4",
    "pydantic>=2.9.2",
    "pypdf>=6.15.0",
    "python-multipart==0.0.12",
    "requests>=2.32.3",
    "slowapi>=0.1.9",
    "soundfile==0.12.1",
