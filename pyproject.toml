[project]
name = "asignment-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av>=12.0.0",
    "fastapi==0.115.0",
    "langchain==0.3.7",
    "langchain-core>=0.3.17,<0.4.0",
    "langchain-openai==0.2.8",
    "langgraph==0.2.53",
    "langgraph-checkpoint-sqlite==2.0.1",
    "language-tool-python==2.8.1",
    "librosa==0.10.2.post1",
    "numpy==1.26.4",
    "pydantic>=2.9.2",
    "pypdf>=6.15.0",
    "python-multipart==0.0.12",
    "requests>=2.32.3",
    "slowapi>=0.1.9",
    "soundfile==0.12.1",
    "uvicorn[standard]==0.30.6",
    "sarvamai>=0.1.30",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest==8.3.5",
    "pytest-cov==6.0.0",
    "pytest-asyncio==0.25.3",
    "httpx==0.28.1",
    # Linting & formatting
    "ruff==0.9.10",
    "black==24.10.0",
    "isort==5.13.2",
    # Type checking
    "mypy==1.13.0",
    "types-requests==2.32.0.20241016",
    # Security
    "bandit[toml]==1.8.3",
    "pip-audit==2.8.0",
]

[project.scripts]
asignment-project = "asignment_project:main"
prod = "prod:main"
dev = "dev:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

# ──────────────────────────────────────────────────────────────────────────
# Tool configuration
# ──────────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--tb=short",
    "-q",
]

[tool.coverage.run]
source = ["analysis", "database", "schema", "config"]
omit = [
    "tests/*",
    "frontend/*",
    ".venv/*",
    "*/migrations/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 60

# ── Ruff ──────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py312"
line-length = 100
# Directories to exclude from linting
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "frontend/vendor",
    "uploads",
    "changes_needed_to_made",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "T20", # flake8-print (no stray print statements)
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long — handled by black/formatter
    "S101",  # use of assert — fine in tests
    "S603",  # subprocess call — used in legitimate places
    "S607",  # partial executable path
    "B008",  # function calls in default arguments (common in FastAPI/Pydantic)
    "T201",  # print found — CLI demo intentionally uses print
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "T201"]
"main.py" = ["T201"]
"analysis/grammar.py" = ["S"]

[tool.ruff.lint.isort]
known-first-party = ["analysis", "api", "config", "database", "graph", "prompts", "schema"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ── Black ─────────────────────────────────────────────────────────────────

[tool.black]
line-length = 100
target-version = ["py312"]
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | frontend/vendor
  | changes_needed_to_made
)/
'''

# ── isort ─────────────────────────────────────────────────────────────────

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["analysis", "api", "config", "database", "graph", "prompts", "schema"]
skip_glob = ["frontend/vendor/*", ".venv/*"]

# ── mypy ──────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict_optional = true
warn_unused_ignores = true
warn_return_any = false
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

# ── Bandit ────────────────────────────────────────────────────────────────

[tool.bandit]
exclude_dirs = [".venv", "venv", "tests", "frontend"]
skips = [
    "B101",  # assert_used — acceptable in tests
    "B311",  # random — not used cryptographically here
]
